# .github/workflows/release.yml

name: Create Release and Deploy

on:
  push:
    tags:
      - 'v*.*.*' # This workflow runs when a new version tag is pushed

permissions:
  contents: write # Needed to create releases and publish to gh-pages

jobs:
  # --- Build Jobs ---
  # These jobs build the application and upload the executable as a named artifact.

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build application for Windows
        # Replace this with your actual Windows build command
        run: echo "win-binary" > btx-sync-win.exe
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: btx-sync-win # The artifact name is now simplified
          path: btx-sync-win.exe

  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build application for macOS
        # Replace this with your actual macOS build command
        run: |
          echo "mac-binary" > btx-sync-mac
          chmod +x btx-sync-mac
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: btx-sync-mac # Consistent artifact name
          path: btx-sync-mac

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build application for Linux
        # Replace this with your actual Linux build command
        run: |
          echo "linux-binary" > btx-sync-linux
          chmod +x btx-sync-linux
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: btx-sync-linux # Consistent artifact name
          path: btx-sync-linux

  # --- Sign, Release, and Deploy Job ---
  # This job orchestrates the signing, release, and deployment process.

  sign-and-release:
    name: Sign, Release, and Deploy
    runs-on: ubuntu-latest
    needs: [build-windows, build-mac, build-linux] # Runs after all builds complete
    env:
      APP_NAME: btx-sync

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install tufup==0.9.0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create TUF keystore from secrets
        run: |
          set -e
          mkdir -p keystore
          echo "${{ secrets.TUF_ROOT_KEY }}" > keystore/root
          echo "${{ secrets.TUF_SNAPSHOT_KEY }}" > keystore/snapshot
          echo "${{ secrets.TUF_TARGETS_KEY }}" > keystore/targets
          echo "${{ secrets.TUF_TIMESTAMP_KEY }}" > keystore/timestamp

      - name: Update TUF repository with new targets
        id: tuf
        run: |
          set -e
          APP_VERSION="${{ github.ref_name }}"

          # UPDATED SCRIPT LOGIC
          # This format is now "suffix:artifact_directory_name:executable_filename"
          # This makes the script more robust if filenames differ from artifact names.
          PLATFORMS="win:btx-sync-win:btx-sync-win.exe mac:btx-sync-mac:btx-sync-mac linux:btx-sync-linux:btx-sync-linux"

          cp -r ./repository ./repo_workspace
          mkdir -p repo_workspace/targets

          for platform_info in $PLATFORMS; do
            IFS=':' read -r p_suffix dir_name file_name <<< "$platform_info"
            echo "--- Adding target: $file_name ---"
            tufup targets add "${APP_VERSION#v}" "artifacts/$dir_name/$file_name" keystore/ repo_workspace/
          done

          echo "--- Signing repository ---"
          tufup sign snapshot keystore/ repo_workspace/
          tufup sign timestamp keystore/ repo_workspace/

      - name: Zip release assets
        run: |
          sudo apt-get -y install zip
          cd artifacts/btx-sync-win && zip btx-sync-win.zip btx-sync-win.exe && cd ../..
          cd artifacts/btx-sync-mac && zip btx-sync-mac.zip btx-sync-mac && cd ../..
          cd artifacts/btx-sync-linux && zip btx-sync-linux.zip btx-sync-linux && cd ../..
          echo "--- Zipped files ---"
          ls -R artifacts

      - name: Deploy repository to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo_workspace
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: Create GitHub Release and upload zipped assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # Upload the newly created .zip files
          files: |
            artifacts/btx-sync-win/btx-sync-win.zip
            artifacts/btx-sync-mac/btx-sync-mac.zip
            artifacts/btx-sync-linux/btx-sync-linux.zip