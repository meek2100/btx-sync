# .github/workflows/release.yml

name: Build, Sign, and Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  APP_NAME: btx-sync

jobs:
  lint_and_test:
    name: Lint and Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Install Poetry
        run: pip install poetry

      - name: Install Dependencies
        run: poetry install

      - name: Run Ruff Formatter Check
        run: poetry run ruff format --check

      - name: Run Ruff Linter
        run: poetry run ruff check

  build:
    name: Build on ${{ matrix.platform.os }}
    needs: lint_and_test
    runs-on: ${{ matrix.platform.os }}
    strategy:
      matrix:
        platform:
          - os: windows-latest
            suffix: win
            asset_name: btx-sync-win.exe
          - os: macos-latest
            suffix: mac
            asset_name: btx-sync-mac
          - os: ubuntu-latest
            suffix: linux
            asset_name: btx-sync-linux
    outputs:
      app_version: ${{ steps.set_version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Create Version Variable from Tag
        id: set_version
        run: |
          VERSION=${{ github.ref_name }}
          echo "version=${VERSION#v}" >> $GITHUB_OUTPUT
        shell: bash

      - name: Install Poetry
        run: pip install poetry

      - name: Install Dependencies
        run: poetry install

      - name: Build the application with PyInstaller
        env:
          # Set path separator based on OS
          pathsep: "${{ runner.os == 'Windows' && ';' || ':' }}"
        run: |
          # The version for the app's internal use is now read from the tag
          echo "__version__ = '${{ steps.set_version.outputs.version }}'" > version.py
          
          poetry run pyinstaller --noconfirm --onefile --windowed `
            --name "${{ env.APP_NAME }}" `
            --icon="${{ runner.os == 'Windows' && 'assets/icon.ico' || 'assets/icon.icns' }}" `
            --add-data "assets${{ env.pathsep }}assets" `
            --add-data "README.md${{ env.pathsep }}." `
            --add-data "repository/metadata/root.json${{ env.pathsep }}repository/metadata" `
            --add-data "version.py${{ env.pathsep }}." `
            app.py
        shell: pwsh

      - name: Rename Artifacts for tufup
        shell: bash
        run: |
          p_os=${{ matrix.platform.os }}
          p_suffix=${{ matrix.platform.suffix }}
          if [ "$p_os" == "windows-latest" ]; then
            mv "dist/${{ env.APP_NAME }}.exe" "dist/${{ env.APP_NAME }}-${p_suffix}.exe"
            echo "Renamed to ${{ env.APP_NAME }}-${p_suffix}.exe"
          else
            mv "dist/${{ env.APP_NAME }}" "dist/${{ env.APP_NAME }}-${p_suffix}"
            echo "Renamed to ${{ env.APP_NAME }}-${p_suffix}"
          fi
      
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.asset_name }}
          path: dist/${{ matrix.platform.asset_name }}

  release:
    name: Sign, Release, and Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install tufup
        run: pip install tufup==0.9.0
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create TUF keystore from secrets
        env:
          TUF_ROOT_KEY: ${{ secrets.TUF_ROOT_PRIVATE_KEY }}
          TUF_SNAPSHOT_KEY: ${{ secrets.TUF_SNAPSHOT_PRIVATE_KEY }}
          TUF_TARGETS_KEY: ${{ secrets.TUF_TARGETS_PRIVATE_KEY }}
          TUF_TIMESTAMP_KEY: ${{ secrets.TUF_TIMESTAMP_PRIVATE_KEY }}
        run: |
          set -e
          mkdir -p keystore
          echo "$TUF_ROOT_KEY" > keystore/root
          echo "$TUF_SNAPSHOT_KEY" > keystore/snapshot
          echo "$TUF_TARGETS_KEY" > keystore/targets
          echo "$TUF_TIMESTAMP_KEY" > keystore/timestamp

      - name: Sign and Deploy Each Platform
        run: |
          set -e
          # Get the app version from the build job's output
          APP_VERSION="${{ needs.build.outputs.app_version }}"
          PLATFORMS="win:btx-sync-win.exe mac:btx-sync-mac linux:btx-sync-linux"

          for platform_info in $PLATFORMS; do
            IFS=':' read -r p_suffix artifact_name <<< "$platform_info"
            echo "--- Processing platform: $p_suffix ---"

            rm -rf temp_workspace
            mkdir -p temp_workspace
            cd temp_workspace

            mkdir -p repository/metadata repository/targets
            cp -r ../keystore ./
            cp -r ../.tufup-repo-config ./
            cp -a ../repository/metadata/. ./repository/metadata/
            
            # CORRECTED COMMAND: Add APP_VERSION as the first argument
            tufup targets add "$APP_VERSION" "../artifacts/$artifact_name/$artifact_name" keystore/

            tufup sign keystore/
            
            mkdir -p ../deploy_repo/$p_suffix
            cp -a ./repository/. ../deploy_repo/$p_suffix/
            
            cd ..
            rm -rf temp_workspace
          done

      - name: Deploy Update Files to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy_repo
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: Create GitHub Release with Automatic Notes
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: |
            artifacts/btx-sync-win.exe/btx-sync-win.exe
            artifacts/btx-sync-mac/btx-sync-mac
            artifacts/btx-sync-linux/btx-sync-linux