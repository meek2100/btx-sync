# .github/workflows/release.yml

name: Create Release and Deploy

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Poetry
        run: pip install poetry
      - name: Install Dependencies
        run: poetry install
      - name: Build with PyInstaller
        run: poetry run pyinstaller --onefile --windowed --name "btx-sync-win" --icon="assets/icon.ico" --add-data "assets;assets" --add-data "README.md;." app.py
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: btx-sync-win
          path: dist/btx-sync-win.exe

  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Poetry
        run: pip install poetry
      - name: Install Dependencies
        run: poetry install
      - name: Build with PyInstaller
        run: poetry run pyinstaller --onefile --windowed --name "btx-sync-mac" --icon="assets/icon.icns" --add-data "assets:assets" --add-data "README.md:." app.py
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: btx-sync-mac
          path: dist/btx-sync-mac

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Tkinter
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Poetry
        run: pip install poetry
      - name: Install Dependencies
        run: poetry install
      - name: Build with PyInstaller
        run: poetry run pyinstaller --onefile --windowed --name "btx-sync-linux" --add-data "assets:assets" --add-data "README.md:." app.py
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: btx-sync-linux
          path: dist/btx-sync-linux

  sign-and-release:
    name: Sign, Release, and Deploy
    runs-on: ubuntu-latest
    needs: [build-windows, build-mac, build-linux]
    env:
      APP_NAME: btx-sync
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install tufup
        run: pip install tufup
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create TUF keystore and repository directories
        run: |
          mkdir -p keystore repository/metadata repository/targets
      - name: Create TUF keystore from secrets
        run: |
          echo "${{ secrets.TUF_ROOT_PRIVATE_KEY }}" > keystore/root.json
          echo "${{ secrets.TUF_SNAPSHOT_PRIVATE_KEY }}" > keystore/snapshot.json
          echo "${{ secrets.TUF_TARGETS_PRIVATE_KEY }}" > keystore/targets.json
          echo "${{ secrets.TUF_TIMESTAMP_PRIVATE_KEY }}" > keystore/timestamp.json
      - name: Update TUF repository
        run: |
          APP_VERSION="${{ github.ref_name }}"
          pwd
          ls -al
          # Add Windows
          tufup targets add "${APP_VERSION#v}" "artifacts/btx-sync-win" keystore/
          # Add macOS
          tufup targets add "${APP_VERSION#v}" "artifacts/btx-sync-mac" keystore/
          # Add Linux
          tufup targets add "${APP_VERSION#v}" "artifacts/btx-sync-linux" keystore/
          # Sign snapshot and timestamp
          tufup sign snapshot keystore/ repository/
          tufup sign timestamp keystore/ repository/
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repository
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/btx-sync-win/btx-sync-win.exe
            artifacts/btx-sync-mac/btx-sync-mac
            artifacts/btx-sync-linux/btx-sync-linux